[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "religion-almanac-backend"
version = "0.1.0"
description = "Canonical data pipeline and API for the Religion Almanac"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2",
  "fastapi>=0.115,<1",
  "jsonschema[format]>=4.23,<5",
  "psycopg[binary]>=3.2,<4",
  "referencing>=0.35,<1",
  "rdflib>=7,<8",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.scripts]
ra-pipeline = "religion_almanac_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["pipeline", "api"]
include = ["religion_almanac_pipeline*", "religion_almanac_api*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
